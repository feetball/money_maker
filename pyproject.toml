[project]
name = "kalshibot"
version = "0.1.0"
description = "Paper-trading bot and dashboard for Kalshi prediction markets (paper only; no real orders)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pyarrow>=15",  # backtests: the hourly research candles (research/data/*.parquet)
    "cryptography>=42",
]

[project.scripts]
kalshibot = "kalshibot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kalshibot"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
